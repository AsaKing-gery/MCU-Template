# =============================================================================
#  GitHub Actions：打 tag 自动发版（编译 → 人工审批 → 发布）
#
#  触发：push 形如 v1.0.1 的 tag（也可在 Actions 页面手动 Run workflow）
#
#  ⚠️ 打 tag 之前，必须先把本文件提交并推送上去。
#     workflow 用的是「被 tag 的那个提交」里的版本 —— 文件还没推，tag 就等于白发。
#
#  两个 job：
#     1. build    —— tag 一推就立刻编译打包，不等任何人
#     2. publish  —— 挂在 release environment 上，**需要人工点 Approve 才会跑**
#
#  ⚠️ 「等待审批」这个闸门是由【仓库设置】决定的：
#       Settings → Environments → 新建一个名叫 release 的环境
#                              → 勾上 Required reviewers → 选上你自己
#     没有配 reviewers 的话，publish 会直接跑，等于没有审批。
#     （详见文件末尾的说明）
#
#  产出（挂在 Releases 页面的 Assets 里）：
#     <产物名>-v1.0.1-debug.bin / .hex / .elf / .map
#     <产物名>-v1.0.1-release.bin / .hex / .elf / .map
#     SHA256SUMS.txt                       ← 烧录前核对用
# =============================================================================
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 默认只给读权限；真正需要写权限的只有 publish 那一步，在 job 级别单独放开。
# 这样即使构建脚本被人塞了后门，它也拿不到仓库写权限。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false      # 发版不允许被后来的运行中途取消

jobs:
  # ===========================================================================
  # 1) 编译 —— tag 一推就跑，不等人
  # ===========================================================================
  build:
    name: 编译固件
    runs-on: ubuntu-latest

    outputs:
      buildable: ${{ steps.probe.outputs.buildable }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build
          echo "--- 版本 ---"
          arm-none-eabi-gcc --version | head -1
          cmake --version | head -1
          ninja --version

      # -----------------------------------------------------------------------
      # 守卫：模板仓库本身是骨架（没有链接脚本），跑不了固件构建。
      # 用显式判断把它变成"跳过"，而不是让整个发版流程变红。
      # -----------------------------------------------------------------------
      - name: 判断是不是可发布的固件工程
        id: probe
        run: |
          if compgen -G "*.ld" >/dev/null || compgen -G "Core/*.ld" >/dev/null \
             || compgen -G "ld/*.ld" >/dev/null || compgen -G "LinkerScript/*.ld" >/dev/null; then
            echo "buildable=true" >> "$GITHUB_OUTPUT"
            echo "找到链接脚本，继续发版"
          else
            echo "buildable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::没找到链接脚本 —— 这个仓库是模板骨架，跳过固件打包（不算失败）。"
          fi

      - name: 编译 Debug
        if: steps.probe.outputs.buildable == 'true'
        run: |
          cmake --preset Debug
          cmake --build --preset Debug

      - name: 编译 Release
        if: steps.probe.outputs.buildable == 'true'
        run: |
          cmake --preset Release
          cmake --build --preset Release

      # -----------------------------------------------------------------------
      # 收集产物并重命名：<产物名>-<tag>-<debug|release>.<ext>
      # 直接把 build/ 里的文件传上去的话，两个配置的 .bin 会重名互相覆盖。
      # -----------------------------------------------------------------------
      - name: 收集产物 + 生成校验和
        if: steps.probe.outputs.buildable == 'true'
        run: |
          set -euo pipefail

          VER="${GITHUB_REF_NAME}"
          case "$VER" in
            v*) ;;
            *) VER="manual-$(date -u +%Y%m%d-%H%M%S)" ;;   # 手动触发时用时间戳
          esac
          echo "版本号: $VER"

          mkdir -p dist
          for preset in Debug Release; do
            for ext in bin hex elf map; do
              for f in build/"$preset"/*."$ext"; do
                [ -e "$f" ] || continue
                base="$(basename "$f" ".$ext")"
                cp "$f" "dist/${base}-${VER}-$(echo "$preset" | tr '[:upper:]' '[:lower:]').${ext}"
              done
            done
          done

          # 应该拿到 2 配置 × 4 扩展名 = 8 个文件；少一个都说明构建有问题
          n="$(find dist -type f | wc -l)"
          if [ "$n" -lt 8 ]; then
            echo "::error::产物数量不对：期望至少 8 个，实际 $n 个"
            ls -l dist || true
            exit 1
          fi

          ( cd dist && sha256sum ./* > SHA256SUMS.txt )

          echo "--- dist ---"
          ls -l dist

      # 编译产物在 job 之间只能靠 artifact 传递（两个 job 跑在不同的机器上）
      - name: 上传编译产物给下一个 job
        if: steps.probe.outputs.buildable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  # ===========================================================================
  # 2) 发布 —— 需要人工审批
  #
  # 这个 job 挂了 environment: release。只要那个 environment 配了
  # Required reviewers，它就会停在 "Waiting for approval"，
  # 直到有人点 Approve 才拿到 runner 开始跑。
  # 审批期间你收到的是 GitHub 的通知邮件，直接在邮件里就能批。
  # ===========================================================================
  publish:
    name: 发布 Release（需人工审批）
    needs: build
    # 只在 tag 推送、且确实是可构建的固件工程时才进入审批
    if: startsWith(github.ref, 'refs/tags/') && needs.build.outputs.buildable == 'true'
    runs-on: ubuntu-latest

    environment:
      name: release
      url: ${{ steps.publish.outputs.url }}

    # 只有这一步需要写仓库内容的权限（创建 Release）
    permissions:
      contents: write

    steps:
      - name: 取回编译产物
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ github.run_number }}
          path: dist

      - name: 预览将要发布的文件（审批通过后第一件事就会看到）
        run: |
          set -euo pipefail
          echo "版本: ${GITHUB_REF_NAME}"
          echo "--- 即将发布到 Release 的附件 ---"
          ls -l dist

      - name: 创建 / 更新 Release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME}"

          if gh release view "$VER" >/dev/null 2>&1; then
            echo "Release $VER 已存在 —— 更新附件（同名文件覆盖）"
            gh release upload "$VER" dist/* --clobber
          else
            echo "创建 Release $VER"
            gh release create "$VER" dist/* \
              --title "$VER" \
              --generate-notes \
              --verify-tag
          fi

          url="$(gh release view "$VER" --json url -q .url)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "已发布: $url"

# =============================================================================
#  一次性设置：开启人工审批
#
#  仓库 → Settings → Environments → New environment → 名字填 release → 保存
#    → 勾选 "Required reviewers" → 填上自己的 GitHub 账号 → Save protection rules
#
#  之后 publish 这个 job 就会停在 Waiting for approval。
#  想加"发版必须两个人点头"，把第二个账号也加进 reviewers 即可（全部批准才放行）。
#
#  注意：没配置这个 environment 时，GitHub 会在首次运行时自动建一个【没有保护规则】的
#  environment —— publish 会直接跑，看起来就像审批功能没生效。所以这一步必须手动做。
# =============================================================================
