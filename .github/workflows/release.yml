# =============================================================================
#  GitHub Actions：打 tag 自动发版（编译 → 人工审核 → 发布）
#
#  触发：push 形如 v1.0.1 的 tag（也可在 Actions 页面手动 Run workflow）
#
#  ⚠️ 打 tag 之前，必须先把本文件提交并推送上去。
#     workflow 用的是「被 tag 的那个提交」里的版本 —— 文件还没推，tag 就等于白发。
#
#  ── 流程 ──────────────────────────────────────────────────────────────────
#     push tag v1.0.1
#        │
#        ├─ [job build]   立刻编译打包（不等人），上传 artifact
#        │
#        └─ [job publish] 自动创建【草稿】Release，把 8 个固件挂上去
#                          ↓
#                     ⬇️ 这里就是"等待审批"
#                     去 Releases 页面下载检查，确认无误后点 "Publish release"
#
#  ── 为什么用"草稿 Release"当审批，而不是 environment ───────────────────────
#    GitHub 原生的审批（environment + Required reviewers）有 plan 限制：
#      "If you are on a GitHub Free, GitHub Pro, or GitHub Team plan,
#       required reviewers are only available for public repositories."
#    也就是说 **私有仓库要配 Required reviewers 得是 Enterprise**。
#    所以这里换成"草稿"机制 —— 任何 plan 都能用，而且审核看到的
#    就是最终要发布的那几个文件，比在 Actions 页面点 Approve 更直接。
#
#    如果你的账号是 Enterprise（或者仓库是公开的），可以打开下面的
#    environment 段拿到 Actions 原生审批闸门，同时把 --draft 去掉。
#    具体改法见文件末尾。
#
#  ── 产出 ──────────────────────────────────────────────────────────────────
#     <产物名>-v1.0.1-debug.bin / .hex / .elf / .map
#     <产物名>-v1.0.1-release.bin / .hex / .elf / .map
#     SHA256SUMS.txt                       ← 烧录前核对用
# =============================================================================
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 默认只给读权限；真正需要写权限的只有 publish 那一步，在 job 级别单独放开。
# 这样即使构建脚本被人塞了后门，它也拿不到仓库写权限。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false      # 发版不允许被后来的运行中途取消

jobs:
  # ===========================================================================
  # 1) 编译 —— tag 一推就跑，不等人
  # ===========================================================================
  build:
    name: 编译固件
    runs-on: ubuntu-latest

    outputs:
      buildable: ${{ steps.probe.outputs.buildable }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build
          echo "--- 版本 ---"
          arm-none-eabi-gcc --version | head -1
          cmake --version | head -1
          ninja --version

      # -----------------------------------------------------------------------
      # 守卫：模板仓库本身是骨架（没有链接脚本），跑不了固件构建。
      # 用显式判断把它变成"跳过"，而不是让整个发版流程变红。
      # -----------------------------------------------------------------------
      - name: 判断是不是可发布的固件工程
        id: probe
        run: |
          if compgen -G "*.ld" >/dev/null || compgen -G "Core/*.ld" >/dev/null \
             || compgen -G "ld/*.ld" >/dev/null || compgen -G "LinkerScript/*.ld" >/dev/null; then
            echo "buildable=true" >> "$GITHUB_OUTPUT"
            echo "找到链接脚本，继续发版"
          else
            echo "buildable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::没找到链接脚本 —— 这个仓库是模板骨架，跳过固件打包（不算失败）。"
          fi

      - name: 编译 Debug
        if: steps.probe.outputs.buildable == 'true'
        run: |
          cmake --preset Debug
          cmake --build --preset Debug

      - name: 编译 Release
        if: steps.probe.outputs.buildable == 'true'
        run: |
          cmake --preset Release
          cmake --build --preset Release

      # -----------------------------------------------------------------------
      # 收集产物并重命名：<产物名>-<tag>-<debug|release>.<ext>
      # 直接把 build/ 里的文件传上去的话，两个配置的 .bin 会重名互相覆盖。
      # -----------------------------------------------------------------------
      - name: 收集产物 + 生成校验和
        if: steps.probe.outputs.buildable == 'true'
        run: |
          set -euo pipefail

          VER="${GITHUB_REF_NAME}"
          case "$VER" in
            v*) ;;
            *) VER="manual-$(date -u +%Y%m%d-%H%M%S)" ;;   # 手动触发时用时间戳
          esac
          echo "版本号: $VER"

          mkdir -p dist
          for preset in Debug Release; do
            for ext in bin hex elf map; do
              for f in build/"$preset"/*."$ext"; do
                [ -e "$f" ] || continue
                base="$(basename "$f" ".$ext")"
                cp "$f" "dist/${base}-${VER}-$(echo "$preset" | tr '[:upper:]' '[:lower:]').${ext}"
              done
            done
          done

          # 应该拿到 2 配置 × 4 扩展名 = 8 个文件；少一个都说明构建有问题
          n="$(find dist -type f | wc -l)"
          if [ "$n" -lt 8 ]; then
            echo "::error::产物数量不对：期望至少 8 个，实际 $n 个"
            ls -l dist || true
            exit 1
          fi

          ( cd dist && sha256sum ./* > SHA256SUMS.txt )

          echo "--- dist ---"
          ls -l dist

      # 编译产物在 job 之间只能靠 artifact 传递（两个 job 跑在不同的机器上）
      - name: 上传编译产物给下一个 job
        if: steps.probe.outputs.buildable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  # ===========================================================================
  # 2) 发布 —— 生成【草稿】Release，等你人工审核后点 Publish
  # ===========================================================================
  publish:
    name: 生成待审的 Release 草稿
    needs: build
    # 只在 tag 推送、且确实是可构建的固件工程时才走这一步
    if: startsWith(github.ref, 'refs/tags/') && needs.build.outputs.buildable == 'true'
    runs-on: ubuntu-latest

    # 【可选】GitHub 原生审批闸门。
    # 默认注释掉：私有仓库 + Free/Pro/Team 用不了 Required reviewers，
    # 写了反而可能让这一步跑不起来。靠下面的 --draft 把关已经够了。
    #
    # 如果你的账号是 Enterprise（或仓库是公开的），想再加一道"必须在 Actions
    # 页面点 Approve 才继续"的硬闸门：
    #   1. Settings → Environments → New environment → 名字填 release
    #      → 勾 Required reviewers → 加上你自己 → Save protection rules
    #   2. 把下面 3 行取消注释
    #   3. 同时把后面 gh release create 的 --draft 去掉（否则要点两次）
    #
    # environment:
    #   name: release
    #   url: ${{ steps.publish.outputs.url }}

    # 只有这一步需要写仓库内容的权限（创建 Release）
    permissions:
      contents: write

    steps:
      - name: 取回编译产物
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ github.run_number }}
          path: dist

      - name: 预览将要发布的文件
        run: |
          set -euo pipefail
          echo "版本: ${GITHUB_REF_NAME}"
          echo "--- 即将挂到 Release 上的附件 ---"
          ls -l dist

      - name: 创建 / 更新 Release 草稿
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME}"

          if gh release view "$VER" >/dev/null 2>&1; then
            echo "Release $VER 已存在 —— 更新附件（同名文件覆盖）"
            gh release upload "$VER" dist/* --clobber
          else
            echo "创建 Release $VER（草稿）"
            gh release create "$VER" dist/* \
              --draft \
              --title "$VER" \
              --generate-notes \
              --verify-tag
          fi

          url="$(gh release view "$VER" --json url -q .url)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

          # 日志里也要讲清楚：多数人只看日志，不看 Summary 标签页
          echo ""
          echo "已生成【草稿】Release: $VER —— 固件已上传，但还没有对外发布。"
          echo "请到 Releases 页面审核，确认无误后点 'Publish release'："
          echo "    https://github.com/${GITHUB_REPOSITORY}/releases"

          # 同时写进本次运行的 Summary（点进 Actions 后第一眼就能看到）
          {
            echo ""
            echo "=============================================================="
            echo "  已生成【草稿】Release: $VER"
            echo "  固件已经上传，但还没有对外发布 —— 这一步就是等你人工审核。"
            echo ""
            echo "  去这里看一眼、确认无误后点 'Publish release'："
            echo "      https://github.com/${GITHUB_REPOSITORY}/releases"
            echo ""
            echo "  不想发就点 'Delete' 把草稿删掉，对已有版本没有任何影响。"
            echo "=============================================================="
          } >> "$GITHUB_STEP_SUMMARY"
          echo "草稿地址: $url"

# =============================================================================
#  人工审核步骤（每次发版都要做）
#
#  1. 打开  https://github.com/<你的账号>/<仓库名>/releases
#  2. 最上面会有一条带 "Draft" 橙色标签的 Release（就是刚才生成的）
#  3. 下载 .bin / .hex 检查 —— 也可以拿 SHA256SUMS.txt 核对：
#         sha256sum -c SHA256SUMS.txt
#  4. 确认没问题 → 点右上角 "Edit" → 滑到底 → "Publish release"
#     有问题     → 点 "Delete" 删掉草稿，改完重新打 tag（或重新跑 workflow）
#
#  点完 Publish 之后，这次发版才算真正完成。
# =============================================================================
