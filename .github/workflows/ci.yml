# =============================================================================
#  GitHub Actions：模板自检
#
#  这个仓库是**模板 / 骨架**，不是固件工程。它没有链接脚本，也没有 newlib 的
#  系统调用桩，所以直接在仓库里 cmake configure/build 是过不去的 ——
#  会红在链接阶段：
#      undefined reference to `_getpid' / `_fstat' / `_isatty'
#      collect2: error: ld returned 1 exit status
#  （因为 mcu.json 的 floatIo=true 会把 newlib-nano 的 stdio 强链进来，
#    那些桩就变成必需的了。真实工程里这份由 CubeMX 生成的 syscalls.c 提供。）
#
#  所以本工作流验证的是「模板本身还好不好用」，分两层：
#
#    A. 静态自检 —— 配置/脚本层面的低级错误，几秒内发现
#         * JSON 能解析（mcu.json / CMakePresets.json）
#         * shell 脚本语法（bash -n）/ PowerShell 脚本可解析
#         * 新建工程会复制的文件是否都在（之前就漏过 .clang-format）
#         * mcu.json 的关键字段是否齐全（缺了工具链文件会直接 FATAL_ERROR）
#
#    B. 端到端冒烟 —— tools/check/ci-smoke.sh
#         复制模板骨架 + 叠加 ci/smoke 里的最小裸机固件，真的编出
#         Debug/Release 固件，并断言 .elf/.hex/.bin/.map 都产出了。
#         它验证的是模板的核心承诺：**复制出去就能编**。
#
#  注意：这里**不检查代码格式**。格式化属于本地流程（tools/check/ci.ps1），
#  而且对 GBK 文件和厂商代码需要额外处理，不适合放在云端。
# =============================================================================
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  self-check:
    name: 模板自检
    runs-on: ubuntu-latest

    env:
      # 让冒烟脚本把工程建在这里，产物才留得住、能上传成 artifact
      SMOKE_WORKDIR: ${{ github.workspace }}/ci-out

    steps:
      - uses: actions/checkout@v4

      - name: 安装工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build
          echo "--- 版本 ---"
          arm-none-eabi-gcc --version | head -1
          cmake --version | head -1
          ninja --version

      # -----------------------------------------------------------------------
      #  A. 静态自检
      # -----------------------------------------------------------------------
      - name: 配置检查（JSON / 脚本语法 / 必备文件 / mcu.json 字段）
        run: |
          set -euo pipefail

          echo "===== 1/4 JSON 配置可解析 ====="
          python3 -c "
          import json, sys
          bad = 0
          for p in ('mcu.json', 'CMakePresets.json'):
              try:
                  json.load(open(p, encoding='utf-8'))
                  print('  OK    ' + p)
              except Exception as exc:
                  print('  FAIL  ' + p + ': ' + str(exc))
                  bad = 1
          print('  （.vscode/*.json 不校验：VSCode 允许 JSONC 注释，不是严格 JSON）')
          sys.exit(bad)
          "

          echo "===== 2/4 shell 脚本语法 ====="
          shopt -s globstar nullglob
          for f in tools/**/*.sh; do
            bash -n "$f"
            echo "  OK    $f"
          done

          if command -v pwsh >/dev/null 2>&1; then
            echo "===== PowerShell 脚本可解析 ====="
            for f in tools/**/*.ps1; do
              pwsh -NoProfile -NonInteractive -Command \
                "[void][ScriptBlock]::Create((Get-Content -Raw -LiteralPath '$f'))"
              echo "  OK    $f"
            done
          else
            echo "  （runner 上没有 pwsh，跳过 PowerShell 检查）"
          fi

          echo "===== 3/4 必备文件清单 ====="
          missing=""
          for f in \
              .clang-format .clangd .gitignore CMakeLists.txt CMakePresets.json mcu.json \
              cmake/gcc-arm-none-eabi.cmake cmake/report_size.cmake cmake/disasm.cmake \
              tools/project/new-project.ps1 tools/project/new-project.sh \
              tools/project/sync-mcu.ps1 tools/project/sync-mcu.sh \
              tools/env/setup-env.ps1 tools/format/fix-encoding.ps1 \
              tools/format/format-all.ps1 tools/build/build.ps1 \
              tools/check/ci.ps1 tools/check/check-includes.ps1 tools/check/ci-smoke.sh \
              .vscode/settings.json .vscode/launch.json \
              .vscode/tasks.json .vscode/extensions.json \
              ci/smoke/Core/Src/main.c ci/smoke/Core/Src/syscalls.c \
              ci/smoke/Core/Startup/startup_smoke.s ci/smoke/STM32F407VGTx_FLASH.ld ; do
            if [ -e "$f" ]; then
              echo "  OK      $f"
            else
              echo "  MISSING $f"
              missing="$missing $f"
            fi
          done
          if [ -n "$missing" ]; then
            echo ""
            echo "::error::模板缺少必需文件，新建工程会拿到不完整的骨架："
            for f in $missing; do
              echo "::error::  MISSING $f"
            done
            echo "  常见原因：文件在本地存在，但没有被提交进 git"
            echo "  （多半是 .gitignore 把它所在的目录一起忽略了）。"
            echo "  用下面这条命令能查出是哪条规则命中的："
            echo "      git check-ignore -v <文件路径>"
            exit 1
          fi

          echo "===== 4/4 mcu.json 关键字段 ====="
          python3 -c "
          import json, sys
          d = json.load(open('mcu.json', encoding='utf-8'))
          need = ('device', 'cpu', 'fpu', 'floatAbi', 'linkerScript', 'svd', 'openocdTarget')
          miss = [k for k in need if k not in d]
          for k in need:
              print(('  OK    ' if k in d else '  MISS  ') + k + ' = ' + str(d.get(k)))
          if miss:
              print('::error::mcu.json 缺少字段 ' + ', '.join(miss) + '（工具链文件会因此 FATAL_ERROR）')
              sys.exit(1)
          "

      # -----------------------------------------------------------------------
      #  B. 端到端冒烟
      # -----------------------------------------------------------------------
      - name: 冒烟构建（复制模板骨架 + 最小固件 → Debug/Release）
        run: bash tools/check/ci-smoke.sh

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: smoke-firmware-${{ github.sha }}
          path: |
            ci-out/build/Debug/*.elf
            ci-out/build/Debug/*.hex
            ci-out/build/Debug/*.bin
            ci-out/build/Debug/*.map
            ci-out/build/Release/*.elf
            ci-out/build/Release/*.hex
            ci-out/build/Release/*.bin
            ci-out/build/Release/*.map
          if-no-files-found: error
          retention-days: 30
